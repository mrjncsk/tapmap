name: Build

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "mkdocs.yml"
      - "README.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "PRIVACY.md"
      - "ARCHITECTURE.md"
      - ".github/workflows/docs.yml"

jobs:
  docker:
    name: Docker Tests
    uses: ./.github/workflows/validate-docker.yml

  linux:
    name: Linux Build
    uses: ./.github/workflows/pipeline-linux.yml
